<!DOCTYPE html>
<html lang="he">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ששת | סמבה ברגל שמאל</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/songs/sambaberegelsmol.css">
<link rel="stylesheet" href="../css/songs/plotter-transport.css">
<link rel="stylesheet" href="../css/songs/plotter-record.css">

<script>
  (function () {
    const raw = sessionStorage.getItem("sheshet_track_transition");
    if (!raw) return;

    try {
      const payload = JSON.parse(raw);
      if (!payload?.direction) return;

      document.documentElement.classList.add("track-transition-enter");
      document.documentElement.dataset.trackEnter = payload.direction;

      if (typeof payload.rollDeg === "number") {
        const startAngle = -payload.rollDeg;
        const normalized = ((startAngle % 360) + 360) % 360;
        const style = document.createElement("style");
        style.id = "track-transition-spin";
        style.textContent =
          "#plotterSpinGroup{transform:rotate(" +
          normalized +
          "deg)!important;animation-play-state:paused!important}";
        document.head.appendChild(style);
      }
    } catch {}
  })();
</script>

</head>

<body class="plotter-page">

  <div class="grid-layer">
    <svg class="grid-svg"></svg>
  </div>

  <!-- Layer order: record base (bottom) -> engravings -> label (top) -->
  <div class="plotter-viewport">
    <div class="plotter-spin-group" id="plotterSpinGroup">

      <div class="plotter-disc" id="plotterRecord"></div>

      <div class="plotter-mount" id="plotterMount"></div>

      <div class="plotter-label-layer" id="plotterLabelLayer">
        <div class="plotter-label" id="plotterLabel">
          <img
            class="plotter-label-svg"
            src="../assets/svg/songs/samba/samba.svg"
            alt=""
          >
        </div>
      </div>

    </div>
  </div>

  <a href="../index.html" class="plotter-home-btn" aria-label="Back to Home">→</a>

  <nav class="plotter-transport" data-track-id="track-a3" aria-label="Playback">
    <button type="button" id="nextBtn" class="plotter-transport-btn" aria-label="Next track">
      <span class="plotter-transport-icon plotter-transport-icon--prev" aria-hidden="true"></span>
    </button>
    <button type="button" id="playBtn" class="plotter-transport-btn plotter-transport-btn--toggle" aria-label="Play" data-state="paused">
      <span class="plotter-transport-icon plotter-transport-icon--play" aria-hidden="true"></span>
      <span class="plotter-transport-icon plotter-transport-icon--pause" aria-hidden="true"></span>
    </button>
    <button type="button" id="prevBtn" class="plotter-transport-btn" aria-label="Previous track">
      <span class="plotter-transport-icon plotter-transport-icon--next" aria-hidden="true"></span>
    </button>
  </nav>

  <audio
    id="sambaAudio"
    src="../audio/songs/samba/sambaberegelsmol.mp3"
    preload="metadata"
  ></audio>

  <!-- Flute stem — analysis only, never audible -->
  <audio
    id="sambaFluteStem"
    src="../audio/songs/samba/sambaberegelsmol-other-A%20major-95bpm-438hz.mp3"
    preload="metadata"
    muted
  ></audio>

  <!-- Guitar stem — analysis only, never audible -->
  <audio
    id="sambaGuitarStem"
    src="../audio/songs/samba/sambaberegelsmol-piano-A%20major-95bpm-438hz.mp3"
    preload="metadata"
    muted
  ></audio>

  <!-- Drums stem — analysis only, never audible -->
  <audio
    id="sambaDrumsStem"
    src="../audio/songs/samba/sambaberegelsmol-drums-A%20major-95bpm-438hz.mp3"
    preload="metadata"
    muted
  ></audio>

  <script src="../js/main.js"></script>
  <script src="../js/plotter/scene.js"></script>
  <script src="../js/plotter/loader.js"></script>
  <script src="../js/plotter/artboard.js"></script>
  <script src="../js/plotter/renderer-svg.js"></script>
  <script src="../js/plotter/path-utils.js"></script>
  <script src="../js/plotter/pen.js"></script>
  <script src="../js/plotter/scheduler.js"></script>
  <script src="../js/plotter/audio-analyser.js"></script>
  <script src="../js/plotter/modulation.js"></script>
  <script src="../js/plotter/track-transition.js"></script>
  <script src="../js/plotter/track-nav.js"></script>
  <script src="../js/plotter/transport.js"></script>
  <script src="../js/plotter/conductor.js"></script>
  <script src="../js/plotter/debug-timecode.js"></script>
  <script src="../js/plotter/index.js"></script>
  <script src="../js/songs/sambaberegelsmol.js"></script>

</body>

</html>
